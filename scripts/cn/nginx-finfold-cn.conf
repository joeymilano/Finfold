# /etc/nginx/sites-available/finfold-cn.conf
# Finfold 国内站反向代理。安装与证书签发步骤见 docs/deploy-cn.md。
#
# 上线顺序注意：ICP 备案通过之前不要把域名解析到本机 80/443（管局审核
# 期间域名须不可从大陆访问）；备案通过后再绑定证书并放开。

limit_req_zone $binary_remote_addr zone=finfold_api:10m rate=30r/s;

# HTTP：证书签发（certbot webroot）保留，其余跳转 HTTPS。
server {
    listen 80;
    listen [::]:80;
    server_name www.finfold.cn finfold.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.finfold.cn$request_uri;
    }
}

# 裸域跳 www。
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name finfold.cn;

    ssl_certificate     /etc/letsencrypt/live/www.finfold.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.finfold.cn/privkey.pem;

    return 301 https://www.finfold.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.finfold.cn;

    ssl_certificate     /etc/letsencrypt/live/www.finfold.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.finfold.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # 上传上限对齐应用侧（源材料/图片）。
    client_max_body_size 20m;

    # 静态资源长缓存（Next 带 contenthash 的构建产物）。
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SSE（生成流式输出）与长请求：关闭缓冲、拉长读超时。
    location /api/ {
        limit_req zone=finfold_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
