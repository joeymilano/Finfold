NEXT_PUBLIC_ALIPAY_QRCODE_IMAGE_URL = "https://your-project-ref.supabase.co/storage/v1/object/public/public-assets/finfold-alipay-qrcode.png"
NEXT_PUBLIC_ALIPAY_QRCODE_PAYEE_NAME = "Finfold"
# ADMIN_USER_IDS is server-only and declared in [secrets] above. Never commit
# the allow-list value or expose it through a NEXT_PUBLIC_ variable.
